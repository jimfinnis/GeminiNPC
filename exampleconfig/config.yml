# configuration data

main:
    show-system-instructions: false
    attack-notification-duration: 20
    default-npc-respond-prob: 0.1
    remove-newlines-from-persona: true

model:
    apikey: Put your key here
    model: gemini-3-flash-preview
    # seconds to wait for a reply before giving up (default 10); preview models can be slow
    timeout: 30



#    model: gemma-3-27b-it
#    baseUrl: http://stibbons.jcf:11434


common-template-directories:
    - plugins/GeminiNPC/common-templates

# every .yml or .yaml file in these directories is loaded as a quest
quest-directories:
    - plugins/GeminiNPC/quests

# Groups of NPCs, which quests can name instead of a single NPC (e.g. spreads-to: [nuns]).
# Each member is an NPC's name, or a persona, which puts every NPC with that persona in
# the group. A YAML persona can also put its NPCs in groups with "groups: [nuns]"; that
# can't be done in a plain text persona, so use this instead.
#npc-groups:
#    doctors: [prune]
#    castle-staff: [Prunesquallor, lofgar]
    

persona-directories:
    - plugins/GeminiNPC/personae

template-values:
    random_personality_features:
        - You really like tea.
        - 
            - You dislike daylight and prefer the dark.
            - You really hate night-time.
        -
            - You are scared of monsters.
            - You actually like monsters and wish peace was an option.
        -
            - You are plain-spoken.
            - You speak like a stereotypical English upper-class person.
            - You speak with a rural accent.
            - You speak with a rural West Country accent.
            - You speak in an educated way, with a fondness for Latin.
        - You are a bit of a philosopher.
        - You are rather vague.
        - You don't like being outside, because of the dirt.
        -
            - You are rather fed up with this place.
            - You are a devotee of Gormenghast and its ritual.
        - You are an agent of Chaos.
        - You love the bees.
        - You are a bit of a gossip.
        - You are a little too fond of swearing.
        - You are very calm.
        
    characters:
        - Prunesquallor, the doctor
        - The Lady Fuchsia, the daughter of the House of Groan
        - The Cantor and his strange language
        - The Namer, isolated in his tower
        - Sallowchime, the irascible architect
        - Boris, the guard
        - Trench, the guard who dreams of being an actor
        - Quicklime, the alchemist
        - Cantel, the kind priest

texts:
    location-list-start: "Locations you can go to: "

    no-skylight-time: You are underground and do not know the time.
    no-skylight-weather: You are underground and do not know the weather.
    in-combat-now: You are currently in a fight!
